name: Relay CI

on:
  push:
  pull_request:

concurrency:
  group: relay-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: relay-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build relay
        run: cargo check --all-targets
      - name: Unit and routing tests
        run: cargo test --lib --bins --tests
