name: relay-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --all-targets

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject historical compiled secret
        shell: bash
        run: |
          needle="echomesh_secret_mesh""_token_2026"
          if grep -R --line-number --exclude-dir=.git "$needle" .; then
            echo 'compiled secret found'
            exit 1
          fi
